name: Beta release

# Publishes a pre-release (for example 2.1.0-beta.1) from main by hand. The app's
# GitHub build offers it only to people who turned on "Receive pre-releases".
on:
  workflow_dispatch:
    inputs:
      version:
        description: Pre-release version, such as 2.1.0-beta.1
        required: true
        type: string

permissions: {}

concurrency:
  # Share the Android runner with debug-apk.yml / manual-release.yml.
  group: android-gradle
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the pre-release
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      version: ${{ steps.publish.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compute version code
        id: meta
        run: |
          base=$(awk -F'+' '/^version:/{print $2; exit}' pubspec.yaml)
          echo "version_code=$((base + 1))" >> "$GITHUB_OUTPUT"

      - name: Get the release app's token
        id: app
        if: vars.DEXTOP_RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DEXTOP_RELEASE_APP_ID }}
          private-key: ${{ secrets.DEXTOP_RELEASE_APP_KEY }}
          permission-contents: write

      - name: Create the tag and pre-release
        id: publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          # Only versions with a pre-release part: stable releases come from the release PR.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*$'; then
            echo "::error::$VERSION is not a pre-release version such as 2.1.0-beta.1"
            exit 1
          fi
          tag="v$VERSION"
          if gh release view "$tag" --repo "$REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$tag already exists"
            exit 1
          fi
          gh release create "$tag" --repo "$REPOSITORY" --target "$TARGET" \
            --title "Dextop $VERSION" --prerelease
          # The reusable APK workflow overwrites the notes with the deterministic
          # Added/Fixed/Removed/Enhanced/Upgraded sections.
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release-apk:
    name: Build and publish the arm64 debug APK
    permissions:
      contents: write
    needs: publish
    if: needs.publish.outputs.tag != ''
    # Debug-signed, arm64-only, suffixed package. No GITHUB_TOKEN event chaining.
    uses: $/.github/workflows/release-apk.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
      version_name: ${{ needs.publish.outputs.version }}
      version_code: ${{ needs.publish.outputs.version_code }}
